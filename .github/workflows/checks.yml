name: Application checks
on:
  push:
    branches: [main, codex/recognition-and-iphone]
    paths: ['backend/**', 'frontend/**', '.github/workflows/checks.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', '.github/workflows/checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend regression tests
        run: |
          python -m pip install './backend[dev]'
          python -m pytest backend/tests -q
      - name: Frontend regression tests and production build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
