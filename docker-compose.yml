services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mtglogger}
      POSTGRES_USER: ${POSTGRES_USER:-mtglogger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mtglogger}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mtglogger:change-me@db:5432/mtglogger}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SCRYFALL_USER_AGENT: ${SCRYFALL_USER_AGENT:-MTGLogger/0.1}
      PRICE_REFRESH_HOURS: ${PRICE_REFRESH_HOURS:-1}
      REFERENCE_DESCRIPTOR_DIR: ${REFERENCE_DESCRIPTOR_DIR:-/app/descriptors}
      NEURAL_SHADOW_MODE: ${NEURAL_SHADOW_MODE:-false}
    volumes:
      - card_images:/app/data
      - ocr_models:/root/.paddlex
      - reference_descriptors:/app/descriptors
    ports: ["${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    ports: ["${WEB_BIND:-0.0.0.0}:${WEB_PORT:-5173}:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  card_images:
  ocr_models:
  reference_descriptors:
