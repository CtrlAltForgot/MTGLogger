services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mtglogger}
      POSTGRES_USER: ${POSTGRES_USER:-mtglogger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mtglogger}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mtglogger:change-me@db:5432/mtglogger}
      CORS_ORIGINS: http://localhost:5173
      SCRYFALL_USER_AGENT: ${SCRYFALL_USER_AGENT:-MTGLogger/0.1}
    volumes:
      - card_images:/app/data
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  postgres_data:
  card_images:
