[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtglogger"
version = "0.1.0"
description = "Speed-first MTG collection catalog API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "starlette>=0.46,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "opencv-python-headless>=4.10,<5",
  "numpy>=2.0,<3",
  "Pillow>=11,<12",
  "ImageHash>=4.3,<5",
]

[project.optional-dependencies]
ocr = ["paddleocr>=3,<4", "paddlepaddle>=3,<4"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
